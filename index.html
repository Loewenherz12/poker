<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background: #01352c;
            color: #e1eacd;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poker-box {
            background-color: #e1eacd;
            color: #01352c;

            width: 500px;
            min-height: 400px;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;

            max-width: 90%;
        }

        h1 {
            background-color: #bad8b6;
            color: #01352c;
            font-size: 60px;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            outline: 3px solid #61b390;
        }

        h2 {
            color: #01352c;
            font-size: 22px;
        }



        .setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        p {
            font-size: 21px;
        }

        input {
            background-color: #bad8b6;
            color: #01352c;

            padding: 10px;

            font-size: 18px;

            border: none;
            border-radius: 8px;

            outline: none;
        }

        input:focus {
            border: 2px solid #61b390;
        }

        button {
            background-color: #61b390;
            color: #01352c;

            padding: 10px 20px;

            font-size: 20px;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        button:hover {
            outline: 2px solid #bad8b6;
            outline-offset: 2px;
        }

        #nextButton {
            display: none;
        }

        #chips {
            display: none;
        }

        #chipsTitle {
            display: none;
        }

        #chipsButton {
            display: none;
        }

        #calculateButton {
            display: none;
        }

        #results {
            display: none;

            width: 100%;

            background-color: #bad8b6;

            padding: 20px;

            border-radius: 12px;

            margin-top: 20px;
        }

        #results h2 {
            margin-bottom: 15px;
        }

        #players,
        #endChips {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            width: 100%;
        }

        #players input,
        #endChips input {
            width: 100%;
        }

        /* Letztes Feld bei ungerader Anzahl mittig */
        #endChips input:last-child:nth-child(odd) {
            grid-column: 1 / 3;
            justify-self: center;
            width: calc(50% - 5px);
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
                align-items: flex-start;
            }

            .poker-box {
                width: 100%;
                max-width: 500px;
                min-height: auto;
                padding: 20px;
                margin-top: 20px;
            }

            h1 {
                font-size: 45px;
                margin-bottom: 10px;
            }

            h2 {
                font-size: 20px;
                text-align: center;
            }

            p {
                font-size: 18px;
            }

            input {
                width: 100%;
                max-width: 300px;
                min-height: 45px;
            }

            button {
                min-height: 45px;
                width: 100%;
                max-width: 300px;
                touch-action: manipulation;
            }

            .setup {
                width: 100%;
            }

            #players,
            #endChips {
                grid-template-columns: 1fr;
                width: 100%;
            }

            #players input,
            #endChips input {
                width: 100%;
            }

            #endChips input:last-child:nth-child(odd) {
                grid-column: auto;
                justify-self: auto;
                width: 100%;
            }

            #results {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="poker-box">

        <h1>Poker</h1>

        <div class="setup">

            <h2>Anzahl der Spieler:</h2>

            <input id="playerCount" type="number" min="2" max="15">

            <button id="startButton">
                Start
            </button>

        </div>


        <div id="players"></div>


        <div id="chips">
            <h2 id="chipsTitle">Chips:</h2>
        </div>


        <button id="nextButton">
            Weiter
        </button>


        <button id="chipsButton">
            Chips setzen
        </button>


        <div id="endChips"></div>


        <button id="calculateButton">
            Abrechnen
        </button>


        <div id="results"></div>

    </div>


    <script>

        // ==========================================
        // ELEMENTE
        // ==========================================

        const playerCount =
            document.getElementById("playerCount");

        const startButton =
            document.getElementById("startButton");

        const players =
            document.getElementById("players");

        const nextButton =
            document.getElementById("nextButton");

        const chips =
            document.getElementById("chips");

        const chipsButton =
            document.getElementById("chipsButton");

        const endChips =
            document.getElementById("endChips");

        const calculateButton =
            document.getElementById("calculateButton");

        const results =
            document.getElementById("results");

        const chipsTitle =
            document.getElementById("chipsTitle");


        // ==========================================
        // DATEN
        // ==========================================

        const playerNames = [];

        let startChips;

        let chipInput;

        const playerEndChips = [];

        const playerDifference = [];

        const chipsGeben = [];

        const chipsBekommen = [];


        // ==========================================
        // SPIELER ERSTELLEN
        // ==========================================

        startButton.addEventListener("click", function () {

            const count =
                Number(playerCount.value);


            if (
                !Number.isInteger(count) ||
                count < 2 ||
                count > 15
            ) {

                alert(
                    "Bitte gib zwischen 2 und 15 Spieler ein."
                );

                return;
            }


            // Falls der Button aus irgendeinem Grund
            // erneut gedrückt wird:

            players.innerHTML = "";


            for (let i = 0; i < count; i++) {

                const input =
                    document.createElement("input");

                input.placeholder =
                    "Spieler " + (i + 1);

                input.id =
                    "player" + i;

                players.append(input);
            }


            nextButton.style.display =
                "block";

            playerCount.style.display =
                "none";

            startButton.style.display =
                "none";
        });


        // ==========================================
        // SPIELERNAMEN ÜBERNEHMEN
        // ==========================================

        nextButton.addEventListener("click", function () {

            // Alte Namen löschen
            playerNames.length = 0;


            const count =
                Number(playerCount.value);


            for (let i = 0; i < count; i++) {

                const input =
                    document.getElementById("player" + i);

                const name =
                    input.value.trim();


                // Leerer Name
                if (name === "") {

                    alert(
                        "Bitte gib für jeden Spieler einen Namen ein."
                    );

                    input.focus();

                    return;
                }


                // Doppelter Name
                if (playerNames.includes(name)) {

                    alert(
                        "Der Name " +
                        name +
                        " wurde bereits verwendet."
                    );

                    input.focus();

                    return;
                }


                playerNames.push(name);
            }


            // Startchip-Eingabe erstellen

            chipInput =
                document.createElement("input");

            chipInput.type =
                "number";

            chipInput.placeholder =
                "Startchips";

            chipInput.min =
                "1";


            chips.innerHTML = "";

            chips.append(chipInput);

            chips.style.display =
                "block";


            nextButton.style.display =
                "none";

            chipsTitle.style.display =
                "block";


            chipsButton.style.display =
                "block";
        });


        // ==========================================
        // STARTCHIPS SETZEN
        // ==========================================

        chipsButton.addEventListener("click", function () {

            startChips =
                Number(chipInput.value);


            if (
                !Number.isFinite(startChips) ||
                startChips <= 0
            ) {

                alert(
                    "Die Startchips müssen größer als 0 sein."
                );

                chipInput.focus();

                return;
            }


            const count =
                playerNames.length;


            // Verhindert doppelte Felder

            endChips.innerHTML = "";


            for (let i = 0; i < count; i++) {

                const input =
                    document.createElement("input");

                input.type =
                    "number";

                input.min =
                    "0";

                input.placeholder =
                    playerNames[i] +
                    "'s übrige Chips";

                input.id =
                    "endChip" + i;


                endChips.append(input);
            }


            chipsButton.style.display =
                "none";

            calculateButton.style.display =
                "block";

            endChips.style.display =
                "grid";
        });


        // ==========================================
        // ABRECHNEN
        // ==========================================

        calculateButton.addEventListener("click", function () {

            // Alte Daten löschen

            playerEndChips.length = 0;

            chipsGeben.length = 0;

            chipsBekommen.length = 0;

            playerDifference.length = 0;


            const count =
                playerNames.length;


            // ======================================
            // ENDCHIPS EINLESEN
            // ======================================

            for (let i = 0; i < count; i++) {

                const input =
                    document.getElementById(
                        "endChip" + i
                    );


                if (input.value === "") {

                    alert(
                        "Bitte gib für jeden Spieler seine übrigen Chips ein."
                    );

                    input.focus();

                    return;
                }


                const value =
                    Number(input.value);


                if (
                    !Number.isFinite(value) ||
                    value < 0
                ) {

                    alert(
                        "Die Anzahl der Chips kann nicht negativ sein."
                    );

                    input.focus();

                    return;
                }


                playerEndChips.push(value);
            }


            // ======================================
            // GESAMTCHIPS PRÜFEN
            // ======================================

            let totalEndChips = 0;


            for (let i = 0; i < count; i++) {

                totalEndChips +=
                    playerEndChips[i];
            }


            const totalStartChips =
                startChips * count;


            if (
                totalEndChips !==
                totalStartChips
            ) {

                alert(
                    "Die Gesamtzahl der Chips stimmt nicht!\n\n" +
                    "Start: " +
                    totalStartChips +
                    " Chips\n" +

                    "Ende: " +
                    totalEndChips +
                    " Chips"
                );

                return;
            }


            // ======================================
            // DIFFERENZEN BERECHNEN
            // ======================================

            for (let i = 0; i < count; i++) {

                const pChips =
                    playerEndChips[i];


                const diff =
                    pChips - startChips;


                if (diff < 0) {

                    chipsGeben.push([
                        playerNames[i],
                        diff
                    ]);

                } else if (diff > 0) {

                    chipsBekommen.push([
                        playerNames[i],
                        diff
                    ]);
                }


                playerDifference.push(diff);
            }


            // ======================================
            // TRANSFERS BERECHNEN
            // ======================================

            let geberIndex = 0;

            let empfaengerIndex = 0;


            const transfers = [];


            while (
                geberIndex < chipsGeben.length &&
                empfaengerIndex < chipsBekommen.length
            ) {

                const geber =
                    chipsGeben[geberIndex];

                const empfaenger =
                    chipsBekommen[empfaengerIndex];


                const geben =
                    Math.abs(geber[1]);

                const bekommen =
                    empfaenger[1];


                const transfer =
                    Math.min(
                        geben,
                        bekommen
                    );


                // Transfer speichern

                transfers.push({
                    geber: geber[0],
                    empfaenger: empfaenger[0],
                    chips: transfer
                });


                // Restbeträge aktualisieren

                geber[1] +=
                    transfer;

                empfaenger[1] -=
                    transfer;


                // Geber fertig?

                if (geber[1] === 0) {

                    geberIndex++;
                }


                // Empfänger fertig?

                if (empfaenger[1] === 0) {

                    empfaengerIndex++;
                }
            }


            // ======================================
            // ERGEBNIS ANZEIGEN
            // ======================================

            results.innerHTML = "";

            results.style.display =
                "block";


            const heading =
                document.createElement("h2");

            heading.textContent =
                "Abrechnung";

            results.append(heading);


            // Keine Transfers nötig

            if (transfers.length === 0) {

                const message =
                    document.createElement("p");

                message.textContent =
                    "Alle Spieler haben ihre Startchips.";

                results.append(message);
            }


            // Transfers anzeigen

            for (let i = 0; i < transfers.length; i++) {

                const transfer =
                    transfers[i];


                const element =
                    document.createElement("p");


                element.textContent =
                    transfer.geber +
                    " → " +
                    transfer.empfaenger +
                    ": " +
                    transfer.chips +
                    " Chips";


                results.append(element);
            }


            // ======================================
            // NEUE RUNDE
            // ======================================

            const resetButton =
                document.createElement("button");


            resetButton.textContent =
                "Neue Runde";


            resetButton.addEventListener(
                "click",
                function () {

                    location.reload();

                }
            );


            results.append(resetButton);
        });

    </script>

</body>

</html>
